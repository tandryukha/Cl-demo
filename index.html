<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Compile Labs – Multi-Model Judge Demo</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    body { margin:0; font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial; background:#0b1020; color:#e8f0ff; }
    header { padding:16px 20px; border-bottom:1px solid #22305a; }
    h1 { margin:0 0 6px; font-size:18px; }
    .hint { color:#8aa0c7; font-size:12px; }

    main { padding:20px; display:grid; grid-template-columns:380px 1fr; gap:16px; }
    @media (max-width: 900px){ main{ grid-template-columns:1fr; } }

    .card { background:#121a33; border:1px solid #22305a; border-radius:12px; padding:14px; }
    label { font-size:12px; color:#8aa0c7; display:block; margin:10px 0 6px; }
    input, select, textarea {
      width:100%; box-sizing:border-box; padding:10px; border-radius:10px;
      border:1px solid #22305a; background:#0c1430; color:#e8f0ff;
    }
    input[type="password"] { font-family: monospace; }
    textarea { min-height:100px; resize:vertical; font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; font-size:12px; }
    button { padding:10px 12px; border-radius:10px; border:1px solid #22305a; background:#0c1430; color:#e8f0ff; cursor:pointer; }
    button.primary { background:#1a2a57; }
    button:hover { filter:brightness(1.08); }
    button:disabled { opacity:0.5; cursor:not-allowed; }
    .row { display:flex; gap:10px; margin-top:10px; flex-wrap:wrap; }
    .status { font-size:12px; color:#8aa0c7; margin-top:8px; }
    .tiny { font-size:11px; color:#8aa0c7; }
    .warn { color:#ffd36b; }

    .model-list { max-height: 200px; overflow-y: auto; border: 1px solid #22305a; border-radius: 8px; padding: 8px; margin-top: 6px; }
    .model-item { display: flex; align-items: center; gap: 8px; padding: 4px 0; font-size: 12px; }
    .model-item input[type="checkbox"] { width: auto; }
    .model-item .price { color: #8aa0c7; margin-left: auto; }

    .results { display: flex; flex-direction: column; gap: 12px; }
    .response-card { background: #0c1430; border: 1px solid #22305a; border-radius: 10px; padding: 12px; }
    .response-card.winner { border-color: #33d17a; box-shadow: 0 0 10px rgba(51,209,122,0.2); }
    .response-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
    .model-name { font-weight: 600; font-size: 13px; }
    .badge { padding: 2px 8px; border-radius: 999px; font-size: 10px; text-transform: uppercase; }
    .badge.winner { background: #1a3d2a; color: #33d17a; }
    .badge.cost { background: #22305a; color: #8aa0c7; }
    .response-text { font-size: 13px; line-height: 1.5; white-space: pre-wrap; word-break: break-word; }

    .judge-card { background: linear-gradient(135deg, #1a2a57 0%, #121a33 100%); border: 1px solid #3a4a7a; }
    .judge-card .model-name { color: #ffd36b; }

    .spinner { display: inline-block; width: 14px; height: 14px; border: 2px solid #22305a; border-top-color: #8aa0c7; border-radius: 50%; animation: spin 1s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }

    .stats { display: flex; gap: 16px; margin-top: 8px; font-size: 11px; color: #8aa0c7; }
  </style>
</head>
<body>
<header>
  <h1>Compile Labs – Multi-Model Judge</h1>
  <div class="hint">
    Run your prompt against multiple models, then let a cheap judge pick the best response.
  </div>
</header>

<main>
  <div class="card">
    <label>API Key</label>
    <input type="password" id="apiKey" placeholder="Paste your API key" />
    <div class="row">
      <button class="primary" id="saveKey">Save Key & Load Models</button>
      <button id="loadModelsBtn" style="display:none;">Reload Models</button>
      <button id="clearKey">Clear</button>
    </div>

    <label>Models to compare (select 2-4)</label>
    <div class="model-list" id="modelList">
      <div class="tiny">Save API key to load models...</div>
    </div>

    <label>Judge model (cheap & fast)</label>
    <select id="judgeModel">
      <option value="">-- Save API key above first --</option>
    </select>
    <div class="tiny">Recommended: gpt-5-nano ($0.05/$0.40 per M tokens)</div>

    <label>Prompt</label>
    <textarea id="prompt">Write a haiku about programming.</textarea>

    <div class="row">
      <button class="primary" id="runCompare" disabled>Run Comparison</button>
    </div>

    <div class="status" id="status">Enter API key to start</div>
    <div class="stats" id="stats"></div>
  </div>

  <div class="card">
    <label>Results</label>
    <div class="results" id="results">
      <div class="tiny">Run a comparison to see results...</div>
    </div>
  </div>
</main>

<script>
  const API_BASE = "https://api.compilelabs.com";
  let apiKey = null;
  let models = [];
  let totalTokens = 0;
  let totalCost = 0;

  const $ = id => document.getElementById(id);
  const setStatus = msg => $("status").textContent = msg;

  function getPrice(pricing, metric) {
    if (!Array.isArray(pricing)) return 0;
    const item = pricing.find(p => p.metric === metric);
    return item?.rate ?? 0;
  }

  function calcCost(model, inputTokens, outputTokens) {
    const inRate = getPrice(model.pricing, "input_tokens");
    const outRate = getPrice(model.pricing, "output_tokens");
    return (inputTokens * inRate + outputTokens * outRate) / 1_000_000;
  }

  async function fetchApi(path, options = {}) {
    const res = await fetch(API_BASE + path, {
      ...options,
      headers: {
        "Authorization": "Bearer " + apiKey,
        "Content-Type": "application/json",
        ...options.headers
      }
    });
    const text = await res.text();
    let json;
    try { json = JSON.parse(text); } catch { json = { raw: text }; }
    if (!res.ok) throw new Error(`${res.status}: ${json.detail || json.raw || text}`);
    return json;
  }

  async function loadModels() {
    setStatus("Loading models...");
    const json = await fetchApi("/v1/models?type=text_generation");
    models = json.data || [];

    // Sort by cost (cheapest first)
    models.sort((a, b) => {
      const costA = getPrice(a.pricing, "input_tokens") + getPrice(a.pricing, "output_tokens");
      const costB = getPrice(b.pricing, "input_tokens") + getPrice(b.pricing, "output_tokens");
      return costA - costB;
    });

    renderModelList();
    renderJudgeSelect();
    $("runCompare").disabled = false;
    $("loadModelsBtn").style.display = "inline-block";
    setStatus(`Loaded ${models.length} models. Select 2-4 to compare.`);
  }

  function renderModelList() {
    const container = $("modelList");
    container.innerHTML = "";

    // Pre-select first 3 cheapest models
    models.forEach((m, i) => {
      const inP = getPrice(m.pricing, "input_tokens");
      const outP = getPrice(m.pricing, "output_tokens");
      const div = document.createElement("div");
      div.className = "model-item";
      div.innerHTML = `
        <input type="checkbox" id="model_${i}" value="${m.id}" ${i < 3 ? 'checked' : ''}>
        <label for="model_${i}">${m.id}</label>
        <span class="price">$${inP}/$${outP}</span>
      `;
      container.appendChild(div);
    });
  }

  function renderJudgeSelect() {
    const select = $("judgeModel");
    select.innerHTML = "";
    // Show cheapest models first for judge
    models.slice(0, 5).forEach(m => {
      const inP = getPrice(m.pricing, "input_tokens");
      const opt = document.createElement("option");
      opt.value = m.id;
      opt.textContent = `${m.id} ($${inP}/M in)`;
      select.appendChild(opt);
    });
  }

  function getSelectedModels() {
    const checkboxes = $("modelList").querySelectorAll("input:checked");
    return Array.from(checkboxes).map(cb => models.find(m => m.id === cb.value));
  }

  async function callModel(model, prompt) {
    const start = Date.now();
    const json = await fetchApi("/v1/chat/completions", {
      method: "POST",
      body: JSON.stringify({
        model: model.id,
        messages: [{ role: "user", content: prompt }]
      })
    });
    const elapsed = Date.now() - start;
    const content = json.choices?.[0]?.message?.content || "(no response)";
    const usage = json.usage || {};
    return { model, content, usage, elapsed };
  }

  async function judgeResponses(responses, judgeModelId, originalPrompt) {
    const judgeModel = models.find(m => m.id === judgeModelId);

    const judgePrompt = `You are a judge evaluating AI responses. Pick the BEST response to this prompt:

ORIGINAL PROMPT: "${originalPrompt}"

${responses.map((r, i) => `--- RESPONSE ${i + 1} (${r.model.id}) ---
${r.content}
`).join("\n")}

Evaluate based on: accuracy, clarity, creativity, and how well it answers the prompt.

Reply with ONLY a JSON object (no markdown):
{"winner": <number 1-${responses.length}>, "reason": "<brief explanation>"}`;

    const start = Date.now();
    const json = await fetchApi("/v1/chat/completions", {
      method: "POST",
      body: JSON.stringify({
        model: judgeModelId,
        messages: [{ role: "user", content: judgePrompt }]
      })
    });
    const elapsed = Date.now() - start;
    const content = json.choices?.[0]?.message?.content || "{}";
    const usage = json.usage || {};

    let verdict;
    try {
      // Try to parse JSON from response (handle markdown code blocks)
      const jsonMatch = content.match(/\{[\s\S]*\}/);
      verdict = JSON.parse(jsonMatch ? jsonMatch[0] : content);
    } catch {
      verdict = { winner: 1, reason: "Could not parse judge response: " + content };
    }

    return { verdict, usage, elapsed, judgeModel };
  }

  function updateStats() {
    $("stats").innerHTML = `
      <span>Total tokens: ${totalTokens.toLocaleString()}</span>
      <span>Est. cost: $${totalCost.toFixed(6)}</span>
    `;
  }

  async function runComparison() {
    const selected = getSelectedModels();
    if (selected.length < 2 || selected.length > 4) {
      alert("Select 2-4 models to compare");
      return;
    }

    const prompt = $("prompt").value.trim();
    if (!prompt) {
      alert("Enter a prompt");
      return;
    }

    const judgeModelId = $("judgeModel").value;
    if (!judgeModelId) {
      alert("Select a judge model");
      return;
    }

    $("runCompare").disabled = true;
    $("results").innerHTML = `<div class="tiny"><span class="spinner"></span> Calling ${selected.length} models in parallel...</div>`;
    setStatus("Running comparisons...");

    try {
      // Call all models in parallel
      const responses = await Promise.all(
        selected.map(model => callModel(model, prompt).catch(err => ({
          model,
          content: `Error: ${err.message}`,
          usage: {},
          elapsed: 0,
          error: true
        })))
      );

      // Track tokens/cost
      responses.forEach(r => {
        if (!r.error) {
          totalTokens += (r.usage.total_tokens || 0);
          totalCost += calcCost(r.model, r.usage.prompt_tokens || 0, r.usage.completion_tokens || 0);
        }
      });

      // Now call the judge
      $("results").innerHTML = `<div class="tiny"><span class="spinner"></span> Judge is evaluating responses...</div>`;
      setStatus("Judge evaluating...");

      const validResponses = responses.filter(r => !r.error);
      let judgeResult = null;

      if (validResponses.length >= 2) {
        judgeResult = await judgeResponses(validResponses, judgeModelId, prompt);
        totalTokens += (judgeResult.usage.total_tokens || 0);
        totalCost += calcCost(judgeResult.judgeModel, judgeResult.usage.prompt_tokens || 0, judgeResult.usage.completion_tokens || 0);
      }

      // Render results
      renderResults(responses, judgeResult);
      updateStats();
      setStatus("Done!");

    } catch (err) {
      $("results").innerHTML = `<div class="warn">Error: ${err.message}</div>`;
      setStatus("Error occurred");
    }

    $("runCompare").disabled = false;
  }

  function renderResults(responses, judgeResult) {
    const container = $("results");
    container.innerHTML = "";

    // Judge verdict card first
    if (judgeResult) {
      const { verdict, elapsed, judgeModel } = judgeResult;
      const div = document.createElement("div");
      div.className = "response-card judge-card";
      div.innerHTML = `
        <div class="response-header">
          <span class="model-name">Judge: ${judgeModel.id}</span>
          <span class="badge cost">${elapsed}ms</span>
        </div>
        <div class="response-text">
          <strong>Winner:</strong> Response #${verdict.winner} (${responses[verdict.winner - 1]?.model.id || "unknown"})<br>
          <strong>Reason:</strong> ${verdict.reason}
        </div>
      `;
      container.appendChild(div);
    }

    // Response cards
    responses.forEach((r, i) => {
      const isWinner = judgeResult && judgeResult.verdict.winner === (i + 1);
      const div = document.createElement("div");
      div.className = `response-card ${isWinner ? 'winner' : ''}`;

      const tokens = r.usage.total_tokens || 0;
      const cost = r.error ? 0 : calcCost(r.model, r.usage.prompt_tokens || 0, r.usage.completion_tokens || 0);

      div.innerHTML = `
        <div class="response-header">
          <span class="model-name">#${i + 1} ${r.model.id}</span>
          <div>
            ${isWinner ? '<span class="badge winner">Winner</span>' : ''}
            <span class="badge cost">${r.elapsed}ms · ${tokens} tok · $${cost.toFixed(6)}</span>
          </div>
        </div>
        <div class="response-text">${escapeHtml(r.content)}</div>
      `;
      container.appendChild(div);
    });
  }

  function escapeHtml(text) {
    const div = document.createElement("div");
    div.textContent = text;
    return div.innerHTML;
  }

  // Event handlers
  $("saveKey").onclick = async () => {
    const key = $("apiKey").value.trim();
    if (!key) { alert("Enter an API key"); return; }
    apiKey = key;
    $("apiKey").value = "";
    $("saveKey").disabled = true;
    $("saveKey").textContent = "Loading...";
    try {
      await loadModels();
      $("saveKey").textContent = "Key Saved ✓";
    } catch (err) {
      setStatus("Failed to load models: " + err.message);
      $("saveKey").textContent = "Save Key & Load Models";
      $("saveKey").disabled = false;
      alert("Error: " + err.message);
    }
  };

  $("clearKey").onclick = () => {
    apiKey = null;
    models = [];
    totalTokens = 0;
    totalCost = 0;
    $("modelList").innerHTML = '<div class="tiny">Save API key to load models...</div>';
    $("judgeModel").innerHTML = '<option value="">-- Save API key above first --</option>';
    $("results").innerHTML = '<div class="tiny">Run a comparison to see results...</div>';
    $("runCompare").disabled = true;
    $("loadModelsBtn").style.display = "none";
    $("saveKey").textContent = "Save Key & Load Models";
    $("saveKey").disabled = false;
    $("stats").innerHTML = "";
    setStatus("Cleared");
  };

  $("runCompare").onclick = runComparison;

  $("loadModelsBtn").onclick = async () => {
    if (!apiKey) { alert("Save API key first"); return; }
    try {
      await loadModels();
    } catch (err) {
      setStatus("Failed to load models");
      alert("Error: " + err.message);
    }
  };
</script>
</body>
</html>
